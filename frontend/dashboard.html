<!DOCTYPE HTML><html>
<head>
  <title>FARMIE DASHBOARD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Gordita|Basier+Mono">
  <style>
    body {
      font-family: 'Gordita', sans-serif;
      margin: 0;
      background-color: #f5f7fa; /* Updated to a softer background color from brand guidelines */
    }
    .topnav {
      overflow: hidden;
      background-color: #5dbb63; /* Updated to brand's primary green color */
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .topnav h3 {
      margin: 0;
      flex-grow: 1;
      text-align: center;
      font-weight: bold;
      font-size: 1.6rem;
      font-family: 'Basier Mono', monospace;
    }
    .time-display {
      font-size: 1.2rem;
      font-weight: bold;
      margin-right: 15px;
    }
    .icon-pointer {
      cursor: pointer;
      font-size: 1.5rem;
    }
    .sidenav {
      height: 100%;
      width: 0;
      position: fixed;
      z-index: 1;
      top: 0;
      left: 0;
      background-color: #4a9e52;
      overflow-x: hidden;
      transition: 0.5s;
      padding-top: 20px;
    }
    .sidenav a {
      padding: 15px 25px;
      text-decoration: none;
      font-size: 1.2rem;
      color: #f1f1f1;
      display: block;
      transition: 0.3s;
    }
    .sidenav a:hover {
      background-color: #5dbb63;
      color: #ffffff;
    }
    .sidenav .closebtn {
      position: absolute;
      top: 0;
      right: 25px;
      font-size: 2rem;
      margin-left: 50px;
    }
    .content {
      padding: 20px;
    }
    .card {
      background-color: #ffffff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
      border: 2px solid #5dbb63; /* Adding border color to match branding */
    }
    .card h4 {
      color: #5dbb63;
      margin-bottom: 15px;
    }
    .card .reading {
      font-size: 2.4rem;
      color: #333;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 200px));
      gap: 20px;
      justify-items: center;
    }
    .mode-switch-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 30px 0;
    }
    .mode-switch-container span {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 0 10px;
      color: #333;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 80px;
      height: 40px;
    }
    .switch input {
      display: none;
    }
    .slider {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.4s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 32px;
      width: 32px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      border-radius: 50%;
      transition: 0.4s;
    }
    input:checked + .slider {
      background-color: #5dbb63;
      box-shadow: 0 0 20px 10px rgba(93, 187, 99, 0.5);
    }
    input:checked + .slider:before {
      transform: translateX(40px);
    }
    .workout-card {
      background-color: #ff6347; /* Updated to brand secondary color (tomato) */
      color: white;
      text-align: center;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 200px;
      height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .workout-card h5 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: bold;
    }
    .workout-card .distance {
      font-size: 2.4rem;
      margin: 10px 0;
    }
    .device-card {
      width: 200px;
      height: 200px;
      padding: 20px;
      background-color: #f4f4f4; /* Updated to match brand palette */
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      border: 2px solid #5dbb63; /* Adding border to align with brand color scheme */
    }
    .device-card h5 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: bold;
      color: #5dbb63; /* Updated to brand's primary color */
    }
    .btn-primary {
      background-color: #5dbb63;
      border-color: #5dbb63;
      color: white;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    .btn-primary:hover {
      background-color: #4a9e52;
      border-color: #4a9e52;
    }
  </style>
</head>
<body>
<div id="mySidenav" class="sidenav">
  <a href="javascript:void(0)" class="closebtn" onclick="toggleSidebar()">&times;</a>
  <a href="#" onclick="showDashboard()">Home</a>
  <a href="#" onclick="showScheduleSettings()">Settings</a>
</div>
<div class="topnav">
  <i class="fas fa-bars icon-pointer" onclick="toggleSidebar()"></i>
  <h3>FARMIE DASHBOARD</h3>
  <span id="current-time" class="time-display">22:53:39</span>
  <i class="fas fa-user-circle icon-pointer" onclick="logoutButton()"></i>
</div>

<div id="dashboard" class="content">
  <div class="mode-switch-container">
    <span>Manual</span>
    <label class="switch">
      <input type="checkbox" id="modeToggle" onchange="toggleMode(this)">
      <span class="slider round"></span>
    </label>
    <span>Auto</span>
  </div>
  <div class="cards">
    <div class="device-card">
      <h5>Fans</h5>
      <button class="btn btn-primary" onclick="toggleDevice(this, 'fan')">Off</button>
    </div>
    <div class="device-card">
      <h5>Lights</h5>
      <button class="btn btn-primary" onclick="toggleDevice(this, 'light')">Off</button>
    </div>
    <div class="device-card">
      <h5>Water Pump</h5>
      <button class="btn btn-primary" onclick="toggleDevice(this, 'waterPump')">Off</button>
    </div>
    <div class="device-card">
      <h5>Fertilizer Pump</h5>
      <button class="btn btn-primary" onclick="toggleDevice(this, 'fertilizerPump')">Off</button>
    </div>
    <div class="card">
      <h4><i class="fas fa-thermometer-half"></i> Temperature</h4>
      <div>
        <p class="reading"><span id="temp"></span>&deg;C</p>
      </div>
    </div>
    <div class="card">
      <h4><i class="fas fa-tint"></i> Humidity</h4>
      <div>
        <p class="reading"><span id="humi"></span>&percnt;</p>
      </div>
    </div>
  </div>
  <div class="card">
    <h4>Schedule Settings</h4>
    <button class="btn btn-primary" onclick="showScheduleSettings()">Go to Schedule Settings</button>
  </div>
</div>

<div id="scheduleSettings" class="content" style="display: none;">
  <div class="card">
    <h4>Schedule Settings</h4>
    <form id="scheduleForm">
      <div class="mb-3">
        <label for="deviceSelect" class="form-label">Select Device:</label>
        <select id="deviceSelect" name="device" class="form-select" onchange="showFields()">
          <option value="light">Light</option>
          <option value="fan">Fan</option>
          <option value="waterPump1">Water Pump Schedule 1</option>
          <option value="waterPump2">Water Pump Schedule 2</option>
          <option value="waterPump3">Water Pump Schedule 3</option>
          <option value="fertilizerPump">Fertilizer Pump</option>
        </select>
      </div>

      <div id="lightFields" class="input-fields">
        <div class="mb-3">
          <label for="lightOnHour" class="form-label">On Hour:</label>
          <input type="number" id="lightOnHour" name="onHour" min="0" max="23" class="form-control">
        </div>
        <div class="mb-3">
          <label for="lightOnMinute" class="form-label">On Minute:</label>
          <input type="number" id="lightOnMinute" name="onMinute" min="0" max="59" class="form-control">
        </div>
        <div class="mb-3">
          <label for="lightOffHour" class="form-label">Off Hour:</label>
          <input type="number" id="lightOffHour" name="offHour" min="0" max="23" class="form-control">
        </div>
        <div class="mb-3">
          <label for="lightOffMinute" class="form-label">Off Minute:</label>
          <input type="number" id="lightOffMinute" name="offMinute" min="0" max="59" class="form-control">
        </div>
      </div>

      <!-- Other device input fields remain unchanged -->

      <button type="button" class="btn btn-primary" onclick="saveSchedule()">Save Schedule</button>
    </form>
    <button class="btn btn-secondary mt-3" onclick="showDashboard()">Back to Dashboard</button>
  </div>
  <div id="scheduleDisplay">
    <h4>Current Schedule:</h4>
    <p id="currentSchedule">No schedule selected</p>
  </div>
</div>

<script>
  function toggleDevice(button, device) {
    const isOff = button.textContent === 'Off';
    if (isOff) {
      button.classList.remove('btn-primary');
      button.classList.add('btn-success');
      button.textContent = 'On';
      console.log(`Toggling ${device} on`);
    } else {
      button.classList.remove('btn-success');
      button.classList.add('btn-primary');
      button.textContent = 'Off';
      console.log(`Toggling ${device} off`);
    }
    // Here you can add the logic to send requests to the backend to toggle devices on or off
  }

  function showScheduleSettings() {
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('scheduleSettings').style.display = 'block';
  }

  function showDashboard() {
    document.getElementById('scheduleSettings').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
  }

  function toggleSidebar() {
    const sidenav = document.getElementById("mySidenav");
    if (sidenav.style.width === "250px") {
      sidenav.style.width = "0";
    } else {
      sidenav.style.width = "250px";
    }
  }
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
